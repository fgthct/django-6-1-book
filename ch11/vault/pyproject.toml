[project]
name = "vault"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "fastembed>=0.9.0",
    "gunicorn>=26.2.0",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.6",
    "whitenoise>=6.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.0.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["config", "documents"]
branch = true
omit = ["*/migrations/*", "*/tests/*", "config/settings_test.py", "config/wsgi.py", "config/asgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["migrations", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "DJ", "S", "SIM"]
ignore = ["S101"]  # assert in the tests

[tool.ruff.lint.per-file-ignores]
"documents/management/commands/create_demo.py" = ["E501", "S106"]
"**/tests/*" = ["S105", "S106", "S311", "S603", "S607"]
