{% load static %}<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="htmx-config" content='{"allowEval": false, "allowScriptTags": false, "includeIndicatorStyles": false}'>
  <title>Bottega</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <script src="{% static 'htmx.min.js' %}" defer></script>
</head>
<body hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'>
  <header>
    <a href="{% url 'shop:catalog' %}">Bottega</a>
    {% partialdef badge inline %}<a id="cart-badge" href="{% url 'shop:cart' %}"{% if oob %} hx-swap-oob="true"{% endif %}>Cart ({{ cart.count }})</a>{% endpartialdef %}
  </header>
  <p id="notice" role="status" aria-live="polite"></p>
  <main>{% block content %}{% endblock %}</main>
  <script {% csp_nonce_attr %}>
    document.addEventListener("message", (e) => {
      document.getElementById("notice").textContent = e.detail.text;
    });
  </script>
</body>
</html>
